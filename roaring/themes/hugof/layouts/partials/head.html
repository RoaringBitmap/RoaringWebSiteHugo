<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }} — A better compressed bitset{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Site.Params.meta.description }}">
<meta name="keywords" content="{{ .Site.Params.meta.keywords }}">
<meta name="theme-color" content="#ea580c">

<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ .Site.Params.meta.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ .Site.BaseURL }}{{ .Site.Params.image.ImageURL }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Site.Title }}">
<meta name="twitter:description" content="{{ .Site.Params.meta.description }}">
<meta name="twitter:image" content="{{ .Site.BaseURL }}{{ .Site.Params.image.ImageURL }}">

<link rel="icon" href="{{ .Site.BaseURL }}{{ .Site.Params.image.IconURL }}">
<link rel="apple-touch-icon" href="{{ .Site.BaseURL }}{{ .Site.Params.image.IconURL }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="stylesheet" href="{{ .Site.BaseURL }}css/styles.css">
