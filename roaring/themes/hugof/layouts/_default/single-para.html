<!doctype html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}
  <main>
    <header class="page-header">
      <div class="container container-narrow">
        <h1>{{ if .Title }}{{ .Title }}{{ else }}{{ .File.BaseFileName | humanize | title }}{{ end }}</h1>
        {{ with .Params.subtitle }}<p>{{ . }}</p>{{ end }}
      </div>
    </header>
    <article class="container container-narrow prose">
      {{ .Content }}
    </article>
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ .Site.BaseURL }}js/app.js" defer></script>
</body>
</html>
